<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1086" width="2560" height="1086" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Five luggage tags hanging from a rail by string, in flat gold and black, the centre tag reading SLOP2618</title>

  <rect width="2560" height="1086" fill="#b97d1c" />

  <!-- rail -->
  <line x1="120" y1="52" x2="2440" y2="52" stroke="#000" stroke-width="6" stroke-linecap="round" />
  <circle cx="120" cy="52" r="10" fill="#000" />
  <circle cx="2440" cy="52" r="10" fill="#000" />

  <!-- strings -->
  <line x1="420" y1="52" x2="420" y2="170" stroke="#000" stroke-width="4" />
  <line x1="880" y1="52" x2="880" y2="230" stroke="#000" stroke-width="4" />
  <line x1="1280" y1="52" x2="1280" y2="300" stroke="#000" stroke-width="4" />
  <line x1="1680" y1="52" x2="1680" y2="210" stroke="#000" stroke-width="4" />
  <line x1="2140" y1="52" x2="2140" y2="160" stroke="#000" stroke-width="4" />

  <!-- tag 1 -->
  <g transform="rotate(-9 420 170)">
    <rect x="270" y="170" width="300" height="420" rx="18" fill="#000" />
    <circle cx="420" cy="210" r="26" fill="#b97d1c" />
    <line x1="320" y1="470" x2="520" y2="470" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <line x1="320" y1="510" x2="480" y2="510" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <text x="420" y="560" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="28" fill="#b97d1c" opacity="0.85">No. 014</text>
  </g>

  <!-- tag 2 -->
  <g transform="rotate(6 880 230)">
    <rect x="730" y="230" width="300" height="420" rx="18" fill="#000" />
    <circle cx="880" cy="270" r="26" fill="#b97d1c" />
    <line x1="780" y1="530" x2="980" y2="530" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <line x1="780" y1="570" x2="940" y2="570" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <text x="880" y="620" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="28" fill="#b97d1c" opacity="0.85">No. 027</text>
  </g>

  <!-- tag 3: the course tag -->
  <g>
    <rect x="1070" y="300" width="420" height="560" rx="22" fill="#000" />
    <circle cx="1280" cy="350" r="30" fill="#b97d1c" />
    <line x1="1140" y1="430" x2="1420" y2="430" stroke="#b97d1c" stroke-width="5" opacity="0.6" />
    <line x1="1140" y1="470" x2="1380" y2="470" stroke="#b97d1c" stroke-width="5" opacity="0.6" />
    <text x="1280" y="620" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="74" font-weight="700" letter-spacing="4" fill="#b97d1c">SLOP2618</text>
    <text x="1280" y="820" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="30" fill="#b97d1c" opacity="0.85">No. 001</text>
  </g>

  <!-- tag 4 -->
  <g transform="rotate(-5 1680 210)">
    <rect x="1530" y="210" width="300" height="420" rx="18" fill="#000" />
    <circle cx="1680" cy="250" r="26" fill="#b97d1c" />
    <line x1="1580" y1="510" x2="1780" y2="510" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <line x1="1580" y1="550" x2="1740" y2="550" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <text x="1680" y="600" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="28" fill="#b97d1c" opacity="0.85">No. 041</text>
  </g>

  <!-- tag 5 -->
  <g transform="rotate(8 2140 160)">
    <rect x="1990" y="160" width="300" height="420" rx="18" fill="#000" />
    <circle cx="2140" cy="200" r="26" fill="#b97d1c" />
    <line x1="2040" y1="460" x2="2240" y2="460" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <line x1="2040" y1="500" x2="2200" y2="500" stroke="#b97d1c" stroke-width="4" opacity="0.6" />
    <text x="2140" y="550" text-anchor="middle" font-family="var(--font-roboto-mono, monospace)" font-size="28" fill="#b97d1c" opacity="0.85">No. 058</text>
  </g>
</svg>
